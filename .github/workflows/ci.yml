name: CI

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests
      - run: python -m pytest -q

  smb-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start a Samba server
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q samba
          sudo mkdir -p /srv/saves && sudo useradd -M synkertest && sudo chown synkertest /srv/saves
          printf '[saves]\n  path = /srv/saves\n  read only = no\n  valid users = synkertest\n' | sudo tee -a /etc/samba/smb.conf
          printf 'secret123\nsecret123\n' | sudo smbpasswd -s -a synkertest
          sudo systemctl restart smbd
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -m smb
        env:
          SYNKER_TEST_SMB_HOST: 127.0.0.1
          SYNKER_TEST_SMB_SHARE: saves
          SYNKER_TEST_SMB_USER: synkertest
          SYNKER_TEST_SMB_PASSWORD: secret123

  decky-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decky
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
