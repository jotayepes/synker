name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    # Older glibc than SteamOS and most desktop distros, so the binary runs everywhere.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install -e ".[dev,gui]"
      - run: python packaging/build.py --gui
      - name: Build the Decky plugin
        run: SYNKER_BIN="$PWD/dist/synker" decky/scripts/package.sh
      - run: |
          mkdir -p release
          cp dist/synker release/synker-linux-x86_64
          cp dist/synker-gui release/synker-gui-linux-x86_64
          cp decky/out/Synker.zip release/Synker-decky.zip
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,gui,keyring]"
      - run: python packaging/build.py --gui
      - run: |
          mkdir release
          copy dist\synker.exe release\synker-windows-x86_64.exe
          copy dist\synker-gui.exe release\synker-gui-windows-x86_64.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
